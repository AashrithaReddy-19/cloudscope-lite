services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: cloudscope, POSTGRES_USER: cloudscope, POSTGRES_PASSWORD: local-development-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U cloudscope"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: {DATABASE_URL: postgresql+psycopg://cloudscope:local-development-only@db:5432/cloudscope, JWT_SECRET: local-development-secret-change-in-production, CORS_ORIGINS: "http://localhost:3000"}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 5s, retries: 10}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["3000:80"]
    depends_on: {backend: {condition: service_healthy}}
volumes: {postgres_data: {}}

