name: cost-policy
on: [push, pull_request]
jobs:
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install python-hcl2
      - run: python scripts/cost_check.py --terraform examples/basic_web_app/main.tf --budget 20 --region us-east-1 --output cost-report.json
      - uses: actions/upload-artifact@v4
        with: {name: cost-report, path: cost-report.json}

